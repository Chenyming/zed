<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zed Agent</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <button id="back" class="icon-button hidden" type="button" aria-label="返回">‹</button>
  <div class="bar-title">
    <div id="title">Zed Agent</div>
    <div id="subtitle" class="muted"></div>
  </div>
  <span id="status" class="chip"></span>
</header>

<main id="login-view" class="view hidden">
  <form id="login-form" class="card login">
    <h1>登录</h1>
    <p class="muted">输入服务器上 <code>~/.config/zed/acp_mux_token</code> 中的 token。</p>
    <input id="token" type="password" autocomplete="current-password" placeholder="token" required>
    <button type="submit" class="primary">登录</button>
    <p id="login-error" class="error"></p>
  </form>
</main>

<main id="list-view" class="view hidden">
  <div id="sessions"></div>
  <p id="sessions-empty" class="muted center hidden">没有会话。在 Zed 里开启 acp-mux 并发起任务后，会话会出现在这里。</p>
  <p class="center"><button id="logout" type="button" class="link">退出登录</button></p>
</main>

<main id="session-view" class="view hidden">
  <div id="session-controls" class="controls hidden"></div>
  <div id="entries"></div>
  <div id="plan" class="card plan hidden"></div>
  <div id="requests"></div>
  <form id="composer" class="composer">
    <textarea id="message" rows="1" placeholder="发送消息…" enterkeyhint="send"></textarea>
    <button id="stop" type="button" class="danger hidden">停止</button>
    <button id="send" type="submit" class="primary">发送</button>
  </form>
  <p id="session-note" class="muted center hidden"></p>
</main>
</body>
</html>
