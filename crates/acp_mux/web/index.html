<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ebebec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2f343e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zed Agent">
<title>Zed Agent</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" class="fill"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-pending" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3.2 3"/></symbol>
  <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-read" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></symbol>
  <symbol id="i-execute" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></symbol>
  <symbol id="i-delete" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M16 3l4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></symbol>
  <symbol id="i-fetch" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-think" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6.5 6.5 0 0 0-3.7 11.85V16h7.4v-1.15A6.5 6.5 0 0 0 12 3z"/></symbol>
  <symbol id="i-switch" viewBox="0 0 24 24"><path d="M4 20v-6M4 10V4M12 20v-8M12 8V4M20 20v-4M20 12V4M2 14h4M10 8h4M18 16h4"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 21.5s8-3.8 8-9.8V5.2L12 2.5 4 5.2v6.5c0 6 8 9.8 8 9.8z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><path d="M3 6l2 2 3.5-3.5M3 15l2 2 3.5-3.5M12 7h9M12 16h9"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10 10 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c6.4 0 10 7 10 7a18 18 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
</svg>

<div id="app" class="app" data-view="list">
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-panel">
      <img class="login-mark" src="/icon.svg" alt="" width="44" height="44">
      <h1>连接到 acp-mux</h1>
      <p class="login-lead">查看和操作在 Zed 远程项目里运行的 agent。</p>
      <label class="field">
        <span class="field-label">登录 token</span>
        <span class="secret">
          <input id="token" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off" required>
          <button id="token-toggle" class="icon-button" type="button" aria-label="显示 token">
            <svg class="icon"><use href="#i-eye"/></svg>
          </button>
        </span>
        <span class="field-hint">在服务器上执行 <code>cat ~/.config/zed/acp_mux_token</code> 查看。</span>
      </label>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button id="login-submit" class="button primary block" type="submit">登录</button>
    </form>
  </section>

  <aside id="sidebar" class="sidebar" aria-label="会话列表">
    <header class="sidebar-head">
      <img class="brand-mark" src="/icon.svg" alt="" width="22" height="22">
      <h1 class="sidebar-title">Agent 会话</h1>
      <span id="connection" class="connection" role="status" aria-live="polite"></span>
    </header>
    <div id="list-banner" class="banner" role="status" hidden></div>
    <nav id="session-list" class="session-list"></nav>
    <footer class="sidebar-foot">
      <button id="logout" class="button ghost small" type="button">
        <svg class="icon"><use href="#i-logout"/></svg>退出登录
      </button>
    </footer>
  </aside>

  <main id="thread" class="thread">
    <div id="thread-empty" class="thread-empty">
      <svg class="icon empty-icon"><use href="#i-message"/></svg>
      <p class="empty-title">选择一个会话</p>
      <p class="empty-text">从左侧列表打开在 Zed 里发起的 agent 会话，查看进度、回答授权请求或继续对话。</p>
    </div>

    <header id="thread-head" class="thread-head" hidden>
      <button id="back" class="icon-button back" type="button" aria-label="返回会话列表">
        <svg class="icon"><use href="#i-chevron-left"/></svg>
      </button>
      <div class="thread-heading">
        <h2 id="thread-title" class="thread-title"></h2>
        <p id="thread-meta" class="thread-meta"></p>
      </div>
      <span id="thread-status" class="status-pill" role="status" aria-live="polite"></span>
    </header>

    <div id="stream" class="stream" hidden>
      <div id="entries" class="entries"></div>
      <div id="generating" class="generating" hidden><span class="shimmer">生成中</span></div>
    </div>

    <button id="jump" class="jump" type="button" hidden>
      <svg class="icon"><use href="#i-arrow-down"/></svg>最新
    </button>

    <footer id="dock" class="dock" hidden>
      <div id="attention" class="attention" hidden>
        <svg class="icon"><use href="#i-shield"/></svg>
        <span id="attention-text"></span>
        <button id="attention-go" class="button small" type="button">查看</button>
      </div>
      <details id="plan" class="plan" hidden>
        <summary class="plan-head">
          <svg class="icon"><use href="#i-plan"/></svg>
          <span class="plan-label">计划</span>
          <span id="plan-progress" class="plan-progress"></span>
          <span id="plan-current" class="plan-current"></span>
          <svg class="icon chevron"><use href="#i-chevron-down"/></svg>
        </summary>
        <ol id="plan-list" class="plan-list"></ol>
      </details>
      <form id="composer" class="composer">
        <label class="visually-hidden" for="message">消息</label>
        <textarea id="message" rows="1" placeholder="给 agent 发消息" enterkeyhint="send"></textarea>
        <div class="composer-bar">
          <div id="controls" class="controls"></div>
          <span id="send-hint" class="send-hint"></span>
          <button id="send" class="send" type="submit" aria-label="发送">
            <svg class="icon"><use href="#i-arrow-up"/></svg>
          </button>
          <button id="stop" class="send stop" type="button" aria-label="停止" hidden>
            <svg class="icon"><use href="#i-stop"/></svg>
          </button>
        </div>
      </form>
      <p id="dock-note" class="dock-note" hidden></p>
    </footer>
  </main>
</div>
</body>
</html>
